# Compila o instalador grafico a partir do codigo publico deste repositorio.
#
# Por que existir: o SignPath Foundation so assina artefato que nasce de um
# build rastreavel no proprio repositorio — e um build publico e reproduzivel
# tambem e' argumento de confianca por si.
#
# A etapa de assinatura fica desligada ate a conta no SignPath existir.
# Para ligar: variavel de repositorio SIGNPATH_ENABLED = true, mais os
# segredos/variaveis descritos em SIGNPATH.md.

name: build-installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dados que nao vivem no repositorio (arte e traducao compilada)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0 --pattern "Pathologic3-Traducao-PTBR.zip" --output release.zip
          python installer/ci_extrair_dados.py release.zip

      - name: Dependencias
        run: python -m pip install --upgrade cx_Freeze customtkinter pillow UnityPy

      - name: Compilar
        working-directory: installer
        run: python -X utf8 setup_build.py build

      - name: Pos-build (desfaz library.zip e confere)
        run: python -X utf8 installer/ci_pos_build.py installer/build/instalador

      - name: Publicar artefato (nao assinado)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: instalador-nao-assinado
          path: installer/build/instalador

  sign:
    needs: build
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Enviar para assinatura no SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: assinado

      - name: Publicar artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: instalador-assinado
          path: assinado
